<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bandeau partenaires – Les Spartiates d’Amiens</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.ptn{font-family:'Barlow',system-ui,sans-serif;color:#060640;background:#ffffff}
.pdisp{font-family:'Barlow Condensed',system-ui,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.pcond{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.plink{display:inline-flex;align-items:center;min-height:44px;font-weight:700;font-size:16px}
.plink:hover{text-decoration:underline}
.ptile{transition:border-color .15s ease}
.ptile:hover{border-color:#060640}
</style>
</helmet>
<section class="ptn" aria-labelledby="spartenaires" style="padding:88px 32px 96px;border-top:4px solid #fcc409">
  <div style="max-width:1320px;margin:0 auto">

    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:48px">
      <div>
        <h2 id="spartenaires" class="pdisp" style="margin:0;font-size:clamp(40px,5vw,64px);line-height:.95">Nos <span style="background:#fcc409;padding:0 10px">Spartenaires</span></h2>
        <p style="margin:14px 0 0;max-width:620px;font-size:18px;line-height:1.55;color:#2c2c5e">Collectivités, institutions et entreprises : ils font vivre les Spartiates, saison après saison.</p>
      </div>
      <a class="plink" href="Contact.dc.html">Devenir partenaire →</a>
    </div>

    <div class="pcond" style="font-size:18px;color:#3b3b6b;margin-bottom:16px">Partenaires publics</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:48px">
      <sc-for list="{{ publics }}" as="p" hint-placeholder-count="4">
        <sc-if value="{{ p.hasLogo }}" hint-placeholder-val="{{ true }}">
          <div class="ptile" style="display:flex;align-items:center;justify-content:center;height:128px;padding:16px;box-sizing:border-box;border:1.5px solid #c9cadf;background:#ffffff">
            <img src="{{ p.logo }}" alt="{{ p.name }}" style="display:block;max-width:100%;max-height:92px;width:auto;height:auto;object-fit:contain">
          </div>
        </sc-if>
        <sc-if value="{{ p.noLogo }}" hint-placeholder-val="{{ false }}">
          <div class="ptile" style="display:flex;align-items:center;justify-content:center;text-align:center;height:128px;padding:16px;box-sizing:border-box;border:1.5px dashed #c9cadf;background:#ffffff">
            <span style="font-size:15px;font-weight:600;color:#3b3b6b">{{ p.name }}</span>
          </div>
        </sc-if>
      </sc-for>
    </div>

    <div class="pcond" style="font-size:18px;color:#3b3b6b;margin-bottom:16px">Partenaires privés</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px">
      <sc-for list="{{ prives }}" as="p" hint-placeholder-count="6">
        <sc-if value="{{ p.hasLogo }}" hint-placeholder-val="{{ true }}">
          <div class="ptile" style="display:flex;align-items:center;justify-content:center;height:128px;padding:16px;box-sizing:border-box;border:1.5px solid #c9cadf;background:#ffffff">
            <img src="{{ p.logo }}" alt="{{ p.name }}" style="display:block;max-width:100%;max-height:92px;width:auto;height:auto;object-fit:contain">
          </div>
        </sc-if>
        <sc-if value="{{ p.noLogo }}" hint-placeholder-val="{{ false }}">
          <div class="ptile" style="display:flex;align-items:center;justify-content:center;text-align:center;height:128px;padding:16px;box-sizing:border-box;border:1.5px dashed #c9cadf;background:#ffffff">
            <span style="font-size:15px;font-weight:600;color:#3b3b6b">{{ p.name }}</span>
          </div>
        </sc-if>
      </sc-for>
    </div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    // =====================================================================
    // PARTENAIRES DU CLUB : liste unique, affichée en bas de toutes les pages.
    // Une ligne = un partenaire.
    //   name : nom (sert aussi de texte alternatif du logo)
    //   type : 'public' | 'prive'
    //   logo : adresse du logo (vide = case « logo à venir »)
    // Tous les logos s'affichent dans des cases identiques, à la même taille.
    // Ordre d'affichage = ordre de la liste.
    // =====================================================================
    const partners = [
      { name: 'Amiens Métropole', type: 'public', logo: '../../assets/logos-partenaires/amiens-metropole.png' },
      { name: 'Région Hauts-de-France', type: 'public', logo: '../../assets/logos-partenaires/region-hauts-de-france.png' },
      { name: '[Partenaire privé 1]', type: 'prive', logo: '' },
      { name: '[Partenaire privé 2]', type: 'prive', logo: '' },
      { name: '[Partenaire privé 3]', type: 'prive', logo: '' },
      { name: '[Partenaire privé 4]', type: 'prive', logo: '' },
      { name: '[Partenaire privé 5]', type: 'prive', logo: '' },
      { name: '[Partenaire privé 6]', type: 'prive', logo: '' }
    ];
    // =====================================================================
    const tile = (p) => ({ name: p.name, logo: p.logo || '', hasLogo: !!p.logo, noLogo: !p.logo });
    const publics = partners.filter((p) => p.type === 'public').map(tile);
    const prives = partners.filter((p) => p.type === 'prive').map(tile);
    return { publics, prives };
  }
}
</script>
</body>
</html>
